<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us - White Water Rafting Company</title>
    <meta name="description" content="Contact White Water Rafting Company for general inquiries, reservation questions, or website suggestions.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street<br>Kolob, California<br>+1 999 999 9999<br>info@whitewater.com</p>
        <div class="contact-grid">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3023.95!2d-117.123!3d33.123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus" width="400" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email">
                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" id="purpose-general" value="General Inquiry"> General Inquiry</label>
                    <label><input type="radio" name="purpose" id="purpose-reservation" value="Reservation Question"> Reservation Question</label>
                    <label><input type="radio" name="purpose" id="purpose-suggestion" value="Website Suggestion"> Website Suggestion</label>
                </fieldset>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
                <label><input type="checkbox" id="subscribe" name="subscribe"> Please subscribe me to the monthly newsletter</label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/client.jpeg" alt="Senior Raft Guide">
                    <figcaption>John Doe - Senior Raft Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting1.jpeg" alt="Tour Manager">
                    <figcaption>Sarah Smith - Tour Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting2.jpeg" alt="Safety Officer">
                    <figcaption>Mike Johnson - Safety Officer</figcaption>
                </figure>
            </div>
            </section>
</main>
<footer>
    <p>&copy; 2026 White Water Rafting Company</p>
    <nav class="sociallinks">
        <a href="https://facebook.com">Facebook</a>
        <a href="https://twitter.com">Twitter</a>
        <a href="https://instagram.com">Instagram</a>
    </nav>
</footer>
</body>
                    </html>
