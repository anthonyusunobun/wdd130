<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Dry Oar Rafting</title>
  <meta name="description" content="Home page for White Water Rafting adventures">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>
  <main>
    <div class="hero">
      <img src="images/hero.jpeg" alt="Rafting adventure">
      <h1>Have An Adventure</h1>
    </div>

      <section class="newsletter">
        <h2>Newsletter</h2>
        <form>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

        <h2>Book Your Adventure!</h2>
        <a href="trips.html">View Trips</a>
      </section>
      <section class="purpose">
        <img src="images/rafting1.jpeg" alt="Rafting purpose">
        <div><h3>Our Purpose</h3><p>Safe and thrilling rafting adventures for everyone.</p></div>
      </section>
      <section class="offering">
        <img src="images/rafting2.jpeg" alt="Rafting offerings">
        <div><h3>What We Offer</h3><p>Half day, full day, and overnight trips with expert guides.</p></div>
      </section>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Dry Oar | Anthony</p>
